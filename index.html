<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyChanger</title>

  <!-- Logo (muzieknoot) in het tabblad van de browser, zit in de code zelf: je hoeft niets te uploaden. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230b5ed7'/%3E%3Cstop offset='1' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cellipse cx='25' cy='45' rx='9' ry='7' transform='rotate(-20 25 45)' fill='white'/%3E%3Crect x='31' y='15' width='4.5' height='30' rx='2' fill='white'/%3E%3Cpath d='M35 15 C44 18 49 24 46 34 C45 28 41 25 35 24 Z' fill='white'/%3E%3C/svg%3E">

  <!-- Mooie lettertypes (gratis, werken direct op internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Sora:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --kop: "Sora", "Segoe UI", Arial, sans-serif;
      --tekst: "Outfit", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 96px 16px 40px;
      font-family: var(--tekst);
      color: #fff;
      overflow-x: hidden;
      /* Blauw -> groen verloop dat rustig beweegt */
      background: linear-gradient(135deg, #0a2a6b, #0b5ed7, #07b0a8, #2fd27a, #0b5ed7, #0a2a6b);
      background-size: 400% 400%;
      animation: verloop 22s ease-in-out infinite;
    }

    @keyframes verloop {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Zachte gloeiende bollen op de achtergrond */
    .bol {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: zweef 16s ease-in-out infinite alternate;
    }
    .bol.een  { width: 380px; height: 380px; background: #38bdf8; top: -80px; left: -80px; }
    .bol.twee { width: 420px; height: 420px; background: #34d399; bottom: -120px; right: -100px; animation-delay: -6s; }
    .bol.drie { width: 260px; height: 260px; background: #22d3ee; top: 45%; left: 55%; animation-delay: -11s; }

    @keyframes zweef {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -30px) scale(1.15); }
    }

    /* Zwevende muzieknootjes */
    .noten-regen { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .noot {
      position: absolute;
      bottom: -60px;
      color: rgba(255, 255, 255, 0.22);
      animation: opstijgen linear infinite;
    }
    @keyframes opstijgen {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      to   { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }

    /* ---------- Liquid glass ---------- */
    .glass {
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      backdrop-filter: blur(18px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1),
        0 12px 32px rgba(0, 20, 60, 0.3);
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 20, 60, 0.35);
    }

    /* ---------- Logo links boven ---------- */
    .merk {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 5;
      display: block;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 20, 60, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .merk:hover { transform: scale(1.07) rotate(-4deg); }
    .merk svg { width: 100%; height: 100%; display: block; }
    .merk.draai { animation: draai 0.7s ease; }
    @keyframes draai { to { transform: rotate(360deg); } }

    /* Het logo dat over het scherm vliegt */
    .vlieger {
      position: fixed;
      left: 0;
      width: 80px;
      height: 80px;
      z-index: 50;
      pointer-events: none;
      filter: drop-shadow(0 12px 22px rgba(0, 20, 60, 0.5));
      will-change: transform;
    }
    .vlieger svg { width: 100%; height: 100%; display: block; }

    /* ---------- Kaart ---------- */
    .kaart {
      position: relative;
      z-index: 1;
      width: min(660px, 100%);
      padding: 28px;
      border-radius: 32px;
    }

    h1 {
      margin: 0 0 4px;
      font-family: var(--kop);
      font-weight: 800;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: -0.5px;
    }

    .ondertitel { margin: 0 0 18px; font-weight: 300; font-size: 17px; opacity: 0.92; }

    /* Equalizer onder de titel */
    .eq {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 34px;
      margin-bottom: 18px;
    }
    .eq span {
      flex: 1;
      min-width: 3px;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(to top, #38bdf8, #4ade80);
      transform-origin: bottom;
      transform: scaleY(0.25);
      animation: eq 1.6s ease-in-out infinite;
      opacity: 0.9;
    }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.2); }
      50%      { transform: scaleY(0.6); }
    }
    .eq.boost span { animation: eqboost 0.6s ease-out; }
    @keyframes eqboost {
      0%   { transform: scaleY(1); }
      100% { transform: scaleY(0.25); }
    }

    textarea {
      width: 100%;
      height: 170px;
      padding: 16px;
      font-size: 17px;
      line-height: 1.5;
      font-family: var(--tekst);
      border-radius: 20px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea::placeholder { color: rgba(255, 255, 255, 0.6); }
    textarea:focus {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 0 0 4px rgba(255, 255, 255, 0.15), 0 12px 32px rgba(0, 20, 60, 0.3);
    }
    textarea.verlicht { animation: opflits 0.9s ease-out; }
    @keyframes opflits {
      0%   { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.9), 0 12px 32px rgba(0, 20, 60, 0.3); }
      100% { box-shadow: 0 0 0 26px rgba(255, 255, 255, 0), 0 12px 32px rgba(0, 20, 60, 0.3); }
    }

    /* ---------- Toonhoogte-wielen (slepen of vegen) ---------- */
    .keuzes {
      display: flex;
      gap: 22px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .toonhoogte { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .toonhoogte .label { font-size: 14px; letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600; opacity: 0.95; }

    .wiel {
      width: 140px;
      height: 156px;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;           /* zodat vegen met je vinger de pagina niet scrolt */
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      transition: background 0.2s, transform 0.15s;
    }
    .wiel:hover { background: rgba(255, 255, 255, 0.22); }
    .wiel.sleept { cursor: grabbing; background: rgba(255, 255, 255, 0.3); transform: scale(1.03); }
    .wiel:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.95); outline-offset: 3px; }

    .wiel .buur {
      font-family: var(--kop);
      font-size: 20px;
      font-weight: 600;
      height: 30px;
      line-height: 30px;
      opacity: 0.5;
    }
    .wiel .groot {
      font-family: var(--kop);
      font-size: 48px;
      font-weight: 800;
      height: 72px;
      line-height: 72px;
    }

    /* ---------- Capo ---------- */
    .capo {
      margin: 24px auto 0;
      width: fit-content;
      min-width: 240px;
      padding: 14px 32px;
      border-radius: 24px;
      text-align: center;
    }
    .capo .label { display: block; font-size: 14px; letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600; }
    .capo .getal { font-family: var(--kop); font-size: 44px; font-weight: 800; line-height: 1.1; }

    /* ---------- Oké-knop ---------- */
    .oke {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border-radius: 24px;
      font-family: var(--kop);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .oke:hover { background: rgba(255, 255, 255, 0.3); }
    .oke:active { transform: scale(0.97); }
    .oke:disabled { opacity: 0.55; cursor: default; }
    .oke:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.95); outline-offset: 3px; }

    .tip { margin: 18px 0 0; text-align: center; font-size: 14px; font-weight: 300; opacity: 0.9; }

    @media (prefers-reduced-motion: reduce) {
      body, .bol, .noot, .eq span { animation: none !important; }
    }
  </style>
</head>

<body>
  <!-- Achtergrond-decoratie -->
  <div class="bol een"></div>
  <div class="bol twee"></div>
  <div class="bol drie"></div>
  <div class="noten-regen" id="noten-regen" aria-hidden="true"></div>

  <!-- Logo links boven: klik erop om alles terug te zetten -->
  <a class="merk" id="logo" href="./" aria-label="KeyChanger, alles terugzetten" title="Alles terugzetten">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="logo-verloop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0b5ed7"/>
          <stop offset="1" stop-color="#34d399"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#logo-verloop)"/>
      <ellipse cx="25" cy="45" rx="9" ry="7" transform="rotate(-20 25 45)" fill="#fff"/>
      <rect x="31" y="15" width="4.5" height="30" rx="2" fill="#fff"/>
      <path d="M35 15 C44 18 49 24 46 34 C45 28 41 25 35 24 Z" fill="#fff"/>
    </svg>
  </a>

  <main class="kaart glass">
    <h1>KeyChanger</h1>
    <p class="ondertitel">Zet je akkoorden in een andere toonsoort en zie meteen welke capo je nodig hebt.</p>

    <div class="eq" id="eq" aria-hidden="true"></div>

    <textarea id="tekst" class="glass" spellcheck="false" autocomplete="off" placeholder="Typ of plak hier je akkoorden of songtekst..."></textarea>

    <div class="keuzes">
      <div class="toonhoogte">
        <span class="label">Originele toonhoogte</span>
        <div class="wiel glass" id="wiel-orig" tabindex="0" role="slider" aria-label="Originele toonhoogte" aria-valuemin="0" aria-valuemax="11">
          <div class="buur" id="orig-boven"></div>
          <div class="groot" id="orig">C</div>
          <div class="buur" id="orig-onder"></div>
        </div>
      </div>

      <div class="toonhoogte">
        <span class="label">Nieuwe toonhoogte</span>
        <div class="wiel glass" id="wiel-nieuw" tabindex="0" role="slider" aria-label="Nieuwe toonhoogte" aria-valuemin="0" aria-valuemax="11">
          <div class="buur" id="nieuw-boven"></div>
          <div class="groot" id="nieuw">C</div>
          <div class="buur" id="nieuw-onder"></div>
        </div>
      </div>
    </div>

    <div class="capo glass">
      <span class="label">Capo</span>
      <span class="getal" id="capo">12</span>
    </div>

    <button class="oke glass" id="oke" type="button">Oké</button>

    <p class="tip">Sleep of veeg met je vinger of muis omhoog en omlaag over een letter om de toonhoogte te kiezen (het muiswiel werkt ook). Druk daarna op Oké.</p>
  </main>

  <script>
    // ---------- Toonhoogtes ----------
    // Alle toonhoogtes in volgorde: C, C#, D, D#, E, F, F#, G, G#, A, A#, B
    const noten = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    // Waar elke letter staat in die lijst
    const basis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

    const tekstvak = document.getElementById("tekst");
    const capoEl = document.getElementById("capo");
    const okeKnop = document.getElementById("oke");
    const logo = document.getElementById("logo");

    // Positie in de lijst (0 = C ... 11 = B)
    const stand = { orig: 0, nieuw: 0 };

    // Hoeveel stappen de tekst al is opgeschoven (zodat een tweede keer Oké niet dubbel schuift)
    let toegepast = 0;

    // Zoekt alle akkoorden in de tekst (A, Dm, G7, C#, Bb, C/G) en schuift ze op.
    // Positief = omhoog, negatief = omlaag. Gewone woorden zoals "Dit" of "Ben" blijven met rust.
    function transponeer(tekst, stappen) {
      const s = ((stappen % 12) + 12) % 12;
      if (s === 0) return tekst;
      const patroon = /\b([A-G])([#b]?)(?=(?:m|maj|min|dim|aug|sus|add)?\d*(?:\/[A-G][#b]?)?(?![A-Za-z]))/g;
      return tekst.replace(patroon, function (_, letter, teken) {
        const plek = basis[letter] + (teken === "#" ? 1 : teken === "b" ? -1 : 0);
        return noten[(((plek + s) % 12) + 12) % 12];
      });
    }

    // Capo: nieuwe toonhoogte hoger dan origineel -> 1, 2, 3, ...
    //       gelijk -> 12
    //       lager  -> 11, 10, 9, ...
    function berekenCapo() {
      const verschil = (((stand.nieuw - stand.orig) % 12) + 12) % 12;
      return verschil === 0 ? 12 : verschil;
    }

    // Is de nieuwe toonhoogte hoger? Dan gaan de akkoorden omlaag (en andersom).
    function gewensteVerschuiving() {
      return -(stand.nieuw - stand.orig);
    }

    // Laat de letters en de capo zien
    function toon() {
      ["orig", "nieuw"].forEach(function (wie) {
        const i = stand[wie];
        document.getElementById(wie).textContent = noten[i];
        document.getElementById(wie + "-boven").textContent = i > 0 ? noten[i - 1] : "";
        document.getElementById(wie + "-onder").textContent = i < 11 ? noten[i + 1] : "";
        document.getElementById("wiel-" + wie).setAttribute("aria-valuenow", i);
        document.getElementById("wiel-" + wie).setAttribute("aria-valuetext", noten[i]);
      });
      capoEl.textContent = berekenCapo();
    }

    // Zet een toonhoogte op een nieuwe stand (van C tot B)
    function zet(wie, waarde) {
      const w = Math.min(11, Math.max(0, waarde));
      if (w === stand[wie]) return;
      stand[wie] = w;
      toon();
      pulseer();
      if (navigator.vibrate) navigator.vibrate(8);
    }

    // ---------- Bediening met vinger of muis ----------
    function maakWiel(wiel, wie) {
      const STAP = 34;            // zoveel pixels slepen = 1 stap
      let actief = false;
      let startY = 0;
      let startStand = 0;
      let wielTeller = 0;

      wiel.addEventListener("pointerdown", function (e) {
        actief = true;
        startY = e.clientY;
        startStand = stand[wie];
        wiel.setPointerCapture(e.pointerId);
        wiel.classList.add("sleept");
        e.preventDefault();
      });

      wiel.addEventListener("pointermove", function (e) {
        if (!actief) return;
        // omhoog slepen = hogere toonhoogte
        const stappen = Math.round((startY - e.clientY) / STAP);
        zet(wie, startStand + stappen);
      });

      function stop() {
        actief = false;
        wiel.classList.remove("sleept");
      }
      wiel.addEventListener("pointerup", stop);
      wiel.addEventListener("pointercancel", stop);

      // Muiswiel
      wiel.addEventListener("wheel", function (e) {
        e.preventDefault();
        wielTeller += e.deltaY;
        if (Math.abs(wielTeller) >= 50) {
          zet(wie, stand[wie] + (wielTeller > 0 ? 1 : -1));
          wielTeller = 0;
        }
      }, { passive: false });

      // Pijltjestoetsen (voor wie een toetsenbord gebruikt)
      wiel.addEventListener("keydown", function (e) {
        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          zet(wie, stand[wie] + (e.key === "ArrowUp" ? 1 : -1));
        }
      });
    }

    maakWiel(document.getElementById("wiel-orig"), "orig");
    maakWiel(document.getElementById("wiel-nieuw"), "nieuw");

    // ---------- Tekst aanpassen: pas na het langsvliegen van het logo ----------
    function pasTekstAan() {
      const gewenst = gewensteVerschuiving();
      tekstvak.value = transponeer(tekstvak.value, gewenst - toegepast);
      toegepast = gewenst;
      tekstvak.classList.remove("verlicht");
      void tekstvak.offsetWidth;
      tekstvak.classList.add("verlicht");
    }

    // Plak je een nieuwe tekst over de oude heen (of begin je opnieuw), dan telt die weer als origineel
    tekstvak.addEventListener("paste", function () {
      if (tekstvak.selectionStart === 0 && tekstvak.selectionEnd === tekstvak.value.length) {
        toegepast = 0;
      }
    });
    tekstvak.addEventListener("input", function () {
      if (tekstvak.value === "") toegepast = 0;
    });

    let vliegt = false;

    okeKnop.addEventListener("click", function () {
      if (vliegt) return;

      // Wie liever geen animaties heeft, krijgt de tekst meteen aangepast
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pasTekstAan();
        pulseer();
        return;
      }

      vliegt = true;
      okeKnop.disabled = true;

      // Een kopie van het logo vliegt van links naar rechts over het tekstvak
      const vlieger = document.createElement("div");
      vlieger.className = "vlieger";
      vlieger.appendChild(logo.querySelector("svg").cloneNode(true));
      const t0 = tekstvak.getBoundingClientRect();
      vlieger.style.top = (t0.top + t0.height / 2 - 40) + "px";
      document.body.appendChild(vlieger);

      const breedte = window.innerWidth;
      const animatie = vlieger.animate(
        [
          { transform: "translateX(-140px) rotate(0deg)" },
          { transform: "translateX(" + (breedte + 140) + "px) rotate(720deg)" }
        ],
        { duration: 1900, easing: "ease-in-out", fill: "forwards" }
      );

      let aangepast = false;
      let klaar = false;

      // Zodra het logo helemaal voorbij het tekstvak is, wordt de tekst aangepast
      function kijk() {
        if (klaar) return;
        const v = vlieger.getBoundingClientRect();
        const t = tekstvak.getBoundingClientRect();
        if (!aangepast && v.left > t.right) {
          aangepast = true;
          pasTekstAan();
          pulseer();
        }
        requestAnimationFrame(kijk);
      }
      requestAnimationFrame(kijk);

      animatie.onfinish = function () {
        klaar = true;
        if (!aangepast) { pasTekstAan(); pulseer(); }
        vlieger.remove();
        vliegt = false;
        okeKnop.disabled = false;
      };
    });

    // ---------- Klik op het logo: alles terug naar het begin ----------
    logo.addEventListener("click", function (e) {
      e.preventDefault();
      if (vliegt) return;
      stand.orig = 0;
      stand.nieuw = 0;
      toegepast = 0;
      tekstvak.value = "";
      toon();
      pulseer();
      logo.classList.remove("draai");
      void logo.offsetWidth;
      logo.classList.add("draai");
    });

    // ---------- Versiering ----------
    // Equalizer-balkjes
    const eq = document.getElementById("eq");
    for (let i = 0; i < 40; i++) {
      const balk = document.createElement("span");
      balk.style.animationDelay = (-Math.random() * 1.6).toFixed(2) + "s";
      balk.style.animationDuration = (1 + Math.random() * 1.2).toFixed(2) + "s";
      eq.appendChild(balk);
    }

    // Laat de equalizer even "springen"
    function pulseer() {
      eq.classList.remove("boost");
      void eq.offsetWidth;
      eq.classList.add("boost");
    }

    // Zwevende muzieknootjes
    const regen = document.getElementById("noten-regen");
    const tekens = ["♪", "♫", "♩", "♬"];
    for (let i = 0; i < 16; i++) {
      const n = document.createElement("span");
      n.className = "noot";
      n.textContent = tekens[i % tekens.length];
      n.style.left = (Math.random() * 100).toFixed(1) + "%";
      n.style.fontSize = (22 + Math.random() * 34).toFixed(0) + "px";
      n.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + "s";
      n.style.animationDelay = (-Math.random() * 25).toFixed(1) + "s";
      regen.appendChild(n);
    }

    toon();
  </script>
</body>
</html>
