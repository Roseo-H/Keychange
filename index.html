<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyChanger</title>

  <style>
    /* Achtergrondafbeelding:C:\Users\hosea\Downloads\Designer (1).png */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #1e3a5f;
      background-image: url("  <style>
    /* Achtergrondafbeelding:C:\Users\hosea\Downloads\Designer (1).png */
    body {
      margin: 0;");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .kaart {
      background: rgba(255, 255, 255, 0.92);
      padding: 24px;
      border-radius: 12px;
      width: min(600px, 90vw);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    h1 { margin-top: 0; }

    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .rij {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    input[type="text"] {
      width: 40px;
      font-size: 18px;
      text-align: center;
      padding: 4px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    .grijs { background: #6b7280; }
    .grijs:hover { background: #4b5563; }
  </style>
</head>

<body>
  <div class="kaart">
    <h1>KeyChanger</h1>
    <p>Typ of plak hier je tekst. Druk daarna op de knop (of op de toets <b>D</b>).</p>

    <textarea id="tekst">Dit is een voorbeeldtekst met veel letters a. Alle a's worden straks veranderd!</textarea>

    <div class="rij">
      Verander de letter
      <input type="text" id="van" value="a" maxlength="1">
      in
      <input type="text" id="naar" value="d" maxlength="1">
    </div>

    <div class="rij">
      <button id="knop">Verander letters</button>
      <button id="reset" class="grijs">Terugzetten</button>
    </div>
  </div>

  <script>
    // Haal de onderdelen van de pagina op, zodat we ze kunnen gebruiken
    const tekstvak = document.getElementById("tekst");
    const van = document.getElementById("van");
    const naar = document.getElementById("naar");
    const knop = document.getElementById("knop");
    const reset = document.getElementById("reset");

    // Onthoud de originele tekst voor de "Terugzetten" knop
    const origineel = tekstvak.value;

    function verander() {
      const zoek = van.value;
      const nieuw = naar.value;
      if (zoek === "") return;

      // "gi" = alle voorkomens (g) en hoofdletters/kleine letters (i)
      const patroon = new RegExp(zoek, "gi");
      tekstvak.value = tekstvak.value.replace(patroon, nieuw);
    }

    // Klik op de knop
    knop.addEventListener("click", verander);

    // Terugzetten
    reset.addEventListener("click", function () {
      tekstvak.value = origineel;
    });

    // Druk op de toets D (maar niet als je net in een vakje aan het typen bent)
    document.addEventListener("keydown", function (e) {
      const typtIn = ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);
      if (!typtIn && e.key.toLowerCase() === "d") {
        verander();
      }
    });
  </script>
</body>
</html>
