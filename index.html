<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyChanger</title>

  <style>
    /* Achtergrondafbeelding: upload je plaatje in GitHub met de naam "achtergrond.png"
       (naast dit bestand). Een pad zoals C:\Users\... werkt NIET op internet. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #1e3a5f;
      background-image: url("achtergrond.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    /* ---------- Liquid glass ---------- */
    .glass {
      background: rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 0 rgba(255, 255, 255, 0.12),
        0 10px 30px rgba(0, 0, 0, 0.28);
      color: white;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .kaart {
      padding: 24px;
      border-radius: 28px;
      width: min(640px, 92vw);
    }

    h1 { margin-top: 0; }

    textarea {
      width: 100%;
      height: 150px;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 18px;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: rgba(255, 255, 255, 0.9); }

    .keuzes {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .toonhoogte {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toonhoogte .label { font-size: 14px; letter-spacing: 0.5px; }

    .pijl, .letter {
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
    }

    .pijl {
      width: 56px;
      height: 32px;
      border-radius: 16px;
      font-size: 14px;
    }

    .letter {
      width: 110px;
      height: 80px;
      border-radius: 26px;
      font-size: 40px;
      font-weight: bold;
    }

    .pijl:hover, .letter:hover { background: rgba(255, 255, 255, 0.28); }
    .pijl:active, .letter:active { transform: scale(0.94); }
    .letter:focus { outline: 2px solid rgba(255, 255, 255, 0.9); outline-offset: 3px; }

    .tip { font-size: 13px; opacity: 0.85; text-align: center; margin: 16px 0 0; }
  </style>
</head>

<body>
  <div class="kaart glass">
    <h1>KeyChanger</h1>

    <textarea id="tekst" class="glass">Am   G   C   F
Dit lied gaat van A naar D en dan naar G.</textarea>

    <div class="keuzes">
      <div class="toonhoogte">
        <span class="label">Originele toonhoogte</span>
        <button class="pijl glass" data-wie="orig" data-richting="1" aria-label="Originele toonhoogte omhoog">▲</button>
        <button class="letter glass" id="orig">A</button>
        <button class="pijl glass" data-wie="orig" data-richting="-1" aria-label="Originele toonhoogte omlaag">▼</button>
      </div>

      <div class="toonhoogte">
        <span class="label">Nieuwe toonhoogte</span>
        <button class="pijl glass" data-wie="nieuw" data-richting="1" aria-label="Nieuwe toonhoogte omhoog">▲</button>
        <button class="letter glass" id="nieuw">A</button>
        <button class="pijl glass" data-wie="nieuw" data-richting="-1" aria-label="Nieuwe toonhoogte omlaag">▼</button>
      </div>
    </div>

    <p class="tip">Klik op een letter en gebruik dan de pijltjestoetsen ↑ en ↓ (of klik op ▲ ▼).</p>
  </div>

  <script>
    // Alle toonhoogtes in volgorde: C, C#, D, D#, E, F, F#, G, G#, A, A#, B
    const noten = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    // Waar elke letter staat in die lijst (C = 0, D = 2, E = 4, F = 5, G = 7, A = 9, B = 11)
    const basis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const tekstvak = document.getElementById("tekst");
    const origEl = document.getElementById("orig");
    const nieuwEl = document.getElementById("nieuw");

    // Positie in de lijst C..B (0 = C, 11 = B)
    const stand = { orig: 0, nieuw: 0 };

    // De tekst zoals hij in de ORIGINELE toonhoogte is
    let bron = tekstvak.value;

    // Verschuift losse noten/akkoorden (zoals A, Dm, G7, C#, Bb, C/G) met een aantal halve tonen.
    // Gewone woorden zoals "Dit" of "Ben" blijven met rust.
    function transponeer(tekst, stappen) {
      const s = ((stappen % 12) + 12) % 12;
      if (s === 0) return tekst;
      const patroon = /\b([A-G])([#b]?)(?=(?:m|maj|min|dim|aug|sus|add)?\d*(?:\/[A-G][#b]?)?(?![A-Za-z]))/g;
      return tekst.replace(patroon, function (_, letter, teken) {
        let plek = basis[letter] + (teken === "#" ? 1 : teken === "b" ? -1 : 0);
        return noten[(((plek + s) % 12) + 12) % 12];
      });
    }

    function toon() {
      origEl.textContent = noten[stand.orig];
      nieuwEl.textContent = noten[stand.nieuw];
      tekstvak.value = transponeer(bron, stand.nieuw - stand.orig);
    }

    // Een stap omhoog (+1) of omlaag (-1), van C tot B
    function verplaats(wie, richting) {
      stand[wie] = Math.min(11, Math.max(0, stand[wie] + richting));
      toon();
    }

    // Als je zelf in het tekstvak typt, onthouden we de tekst in de originele toonhoogte
    tekstvak.addEventListener("input", function () {
      bron = transponeer(tekstvak.value, -(stand.nieuw - stand.orig));
    });

    // Pijltjes-knoppen (▲ ▼)
    document.querySelectorAll(".pijl").forEach(function (knop) {
      knop.addEventListener("click", function () {
        verplaats(knop.dataset.wie, Number(knop.dataset.richting));
      });
    });

    // Pijltjestoetsen op het toetsenbord als een letter-knop is aangeklikt
    [origEl, nieuwEl].forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          verplaats(el.id, e.key === "ArrowUp" ? 1 : -1);
        }
      });
    });

    toon();
  </script>
</body>
</html>
